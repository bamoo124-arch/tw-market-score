name: 資料來源檢測
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tools/probe.py
      - if: always()
        run: |
          git config user.name "market-score-bot"; git config user.email "actions@users.noreply.github.com"
          git add logs/probe.txt && git commit -m "資料來源檢測" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
