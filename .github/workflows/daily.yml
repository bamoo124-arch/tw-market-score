name: 每日盤後更新

on:
  schedule:
    # 台北時間週一到週五 17:40（法人與期貨資料約 15:00–16:30 公布），20:10 再補跑一次
    - cron: "45 9 * * 1-5"
    - cron: "10 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p logs
          set -o pipefail
          timeout 150m python src/fetch.py 2>&1 | tee logs/fetch.log
      - name: 存回 repo（同步最新程式後重新計分）
        if: always()
        run: |
          set -x
          git config user.name "market-score-bot"
          git config user.email "actions@users.noreply.github.com"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp -r data logs "$OUT"/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r "$OUT"/data "$OUT"/logs . 2>/dev/null || true
            set -o pipefail
            python src/model.py 2>&1 | tee logs/model.log || true
            git add -A data docs/data.json logs
            git diff --cached --quiet && break
            git commit -q -m "盤後更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push -q origin HEAD:main && break
            sleep 10
          done
